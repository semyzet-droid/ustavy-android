plugins { id 'com.android.application' }
android {
 namespace 'ru.ustavy.offline'
 compileSdk 35
 ndkVersion '28.0.13004108'
 defaultConfig {
  applicationId 'ru.ustavy.offline'
  minSdk 28
  targetSdk 35
  versionCode 1
  versionName '0.1.0'
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-std=c++17' } }
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 androidResources { noCompress += ['gguf'] }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
