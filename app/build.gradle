plugins { id 'com.android.application' }
def readerTest = project.hasProperty('readerTest')
def standaloneTranslator = project.hasProperty('standaloneTranslator')
android {
 namespace 'ru.ustavy.offline'
 compileSdk 35
 ndkVersion '28.0.13004108'
 defaultConfig {
  applicationId standaloneTranslator ? 'ru.ustavy.offline.translator' : 'ru.ustavy.offline.books'
  manifestPlaceholders = [appLabel: standaloneTranslator ? 'Уставы • переводчик' : 'Уставы • книги']
  minSdk 28
  targetSdk 35
  versionCode 7
  versionName '0.7.0'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  if (!readerTest) {
   ndk { abiFilters 'arm64-v8a' }
   externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-std=c++17' } }
  }
 }
 if (!readerTest) { externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } } }
 signingConfigs { debug { if (!readerTest) { storeFile rootProject.file('.ci-signing/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } } }
 androidResources { noCompress += ['gguf'] }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
 implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

