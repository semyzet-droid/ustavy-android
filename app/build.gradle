plugins { id 'com.android.application' }
def readerTest = project.hasProperty('readerTest')
android {
 namespace 'ru.ustavy.offline'
 compileSdk 35
 ndkVersion '28.0.13004108'
 defaultConfig {
  applicationId 'ru.ustavy.offline.books'
  minSdk 28
  targetSdk 35
  versionCode 3
  versionName '0.3.0'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  if (!readerTest) {
   ndk { abiFilters 'arm64-v8a' }
   externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-std=c++17' } }
  }
 }
 if (!readerTest) { externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } } }
 androidResources { noCompress += ['gguf'] }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
 implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

