name: Build offline Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-main
  cancel-in-progress: true
jobs:
  reader-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Bundle verified offline OCR languages
        run: python3 scripts/prepare_ocr.py
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle :app:connectedDebugAndroidTest -PreaderTest --stacktrace --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-device-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
  build:
    needs: reader-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.22.1"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ustavy-books-test-signing-v1
      - name: Fetch pinned inference engine
        run: |
          mkdir -p vendor/llama.cpp
          curl --fail --location --retry 3 https://github.com/ggml-org/llama.cpp/archive/4a45de4f2c68f3d144f6c2431ad7c1da7e53c99e.tar.gz | tar xz --strip-components=1 -C vendor/llama.cpp
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/model.gguf
          key: qwen-1.5b-91cad51-q4km
      - name: Prepare offline assets
        run: |
          pip install pypdf==6.1.1
          python3 scripts/prepare_assets.py
          python3 scripts/prepare_ocr.py
      - name: Test offline interface
        run: |
          npm install --prefix /tmp/ustavy-tests playwright@1.56.1
          /tmp/ustavy-tests/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/ustavy-tests/node_modules node scripts/ui-test.cjs
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --max-workers=2
      - name: Verify signature and offline manifest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk > permissions.txt
          if grep -q android.permission.INTERNET permissions.txt; then exit 1; fi
          cp app/build/outputs/apk/debug/app-debug.apk ustavy-offline.apk
          sha256sum ustavy-offline.apk > SHA256SUMS.txt
      - name: Create verified ZIP download
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("ustavy-offline.zip","w",compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              z.write("ustavy-offline.apk")
          with zipfile.ZipFile("ustavy-offline.zip") as z:
              assert z.testzip() is None
          PY
      - name: Create and verify RAR download
        run: |
          mkdir -p rar-bin
          curl --fail --location --retry 3 https://www.rarlab.com/rar/rarlinux-x64-723.tar.gz | tar xz --strip-components=1 -C rar-bin
          ./rar-bin/rar a -ma5 -m3 -md32m -ep ustavy-books.rar ustavy-offline.apk
          ./rar-bin/rar t -idq ustavy-books.rar
          python3 -c 'assert open("ustavy-books.rar","rb").read(8) == b"Rar!\x1a\x07\x01\x00"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ustavy-offline
          path: |
            ustavy-offline.apk
            SHA256SUMS.txt
            ASSET_REPORT.json
            SOURCE_DIAGNOSTIC.txt
          compression-level: 0
          retention-days: 7
      - name: Publish installable test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" ustavy-offline.apk ustavy-offline.zip ustavy-books.rar SHA256SUMS.txt ASSET_REPORT.json --title "Уставы и книги 0.4 — OCR и темы — сборка ${{ github.run_number }}" --notes "Тема и фон: тёмная, светлая, тёплая, чёрная, свой цвет и своя картинка с телефона; общее оформление приложения и читалки. PDF с иллюстрациями, TXT, JPG/PNG/WebP. Масштаб страниц, закладки и сохранение места. Офлайн OCR русского и английского печатного текста из PDF и фотографий. Кнопка Распознать текст на текущей странице; проверка и исправление результата, сохранение для поиска и ИИ. Проверены реальное распознавание русского текста, скан PDF и пустая страница. Новое приложение Уставы • книги устанавливается рядом с первой версией. Проверены чтение PDF, иллюстрации и восстановление страницы в Android-эмуляторе. Без INTERNET. Проверка на Samsung S25 Ultra требуется." --prerelease --target "${{ github.sha }}"

