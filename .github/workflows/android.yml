name: Build offline Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-main
  cancel-in-progress: true
jobs:
  reader-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Bundle verified offline OCR languages
        run: python3 scripts/prepare_ocr.py
      - uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/nmt
            app/src/main/assets/nmt-runtime
          key: opus-mt-four-directions-v1
      - name: Bundle specialized offline translation models
        run: python3 scripts/prepare_nmt.py
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle :app:connectedDebugAndroidTest -PreaderTest --stacktrace --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-device-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
  build:
    needs: reader-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.22.1"
      - uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: ustavy-test-signing-v2
      - name: Prepare repeatable test signing key
        run: |
          mkdir -p .ci-signing
          if [ ! -s .ci-signing/debug.keystore ]; then
            keytool -genkeypair -keystore .ci-signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ustavy Test Build"
          fi
      - name: Fetch pinned inference engine
        run: |
          mkdir -p vendor/llama.cpp
          curl --fail --location --retry 3 https://github.com/ggml-org/llama.cpp/archive/4a45de4f2c68f3d144f6c2431ad7c1da7e53c99e.tar.gz | tar xz --strip-components=1 -C vendor/llama.cpp
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/model.gguf
          key: qwen-1.5b-91cad51-q4km
      - name: Prepare offline assets
        run: |
          pip install pypdf==6.1.1
          python3 scripts/prepare_assets.py
          python3 scripts/prepare_ocr.py
      - uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/nmt
            app/src/main/assets/nmt-runtime
          key: opus-mt-four-directions-v1
      - name: Bundle specialized offline translation models
        run: python3 scripts/prepare_nmt.py
      - name: Test offline interface
        run: |
          npm install --prefix /tmp/ustavy-tests playwright@1.56.1
          /tmp/ustavy-tests/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/ustavy-tests/node_modules node scripts/ui-test.cjs
          NODE_PATH=/tmp/ustavy-tests/node_modules node scripts/nmt-test.cjs
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --max-workers=2
      - name: Verify signature and offline manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ustavy-previous
          gh release download build-15 --pattern ustavy-offline.apk --dir /tmp/ustavy-previous
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs /tmp/ustavy-previous/ustavy-offline.apk > /tmp/old-certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > /tmp/new-certificate.txt
          python3 - <<'PYCOMPARE'
          import pathlib,re
          old=pathlib.Path('/tmp/old-certificate.txt').read_text()
          new=pathlib.Path('/tmp/new-certificate.txt').read_text()
          pattern=r'Signer #1 certificate SHA-256 digest: (\S+)'
          same=re.search(pattern,old).group(1)==re.search(pattern,new).group(1)
          pathlib.Path('/tmp/standalone-translator').write_text('no' if same else 'yes')
          pathlib.Path('INSTALLATION.txt').write_text('Обновление Уставы • книги.' if same else 'Установи Уставы • переводчик рядом с Уставы • книги. Подпись прежней тестовой версии недоступна. Старая версия и её книги/заметки сохранятся; в новой версии импортируй нужные книги заново.',encoding='utf-8')
          print('Previous signer matches:',same)
          PYCOMPARE
          if [ "$(cat /tmp/standalone-translator)" = "yes" ]; then
            gradle :app:assembleDebug -PstandaloneTranslator --stacktrace --max-workers=2
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk > permissions.txt
          if grep -q android.permission.INTERNET permissions.txt; then exit 1; fi
          cp app/build/outputs/apk/debug/app-debug.apk ustavy-offline.apk
          sha256sum ustavy-offline.apk > SHA256SUMS.txt
      - name: Create verified ZIP download
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("ustavy-offline.zip","w",compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              z.write("ustavy-offline.apk")
          with zipfile.ZipFile("ustavy-offline.zip") as z:
              assert z.testzip() is None
          PY
      - name: Create and verify RAR download
        run: |
          mkdir -p rar-bin
          curl --fail --location --retry 3 https://www.rarlab.com/rar/rarlinux-x64-723.tar.gz | tar xz --strip-components=1 -C rar-bin
          ./rar-bin/rar a -ma5 -m3 -md32m -ep ustavy-books.rar ustavy-offline.apk
          ./rar-bin/rar t -idq ustavy-books.rar
          python3 -c 'assert open("ustavy-books.rar","rb").read(8) == b"Rar!\x1a\x07\x01\x00"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ustavy-offline
          path: |
            ustavy-offline.apk
            SHA256SUMS.txt
            ASSET_REPORT.json
            SOURCE_DIAGNOSTIC.txt
            TRANSLATION_TESTS.json
            NMT_ASSET_REPORT.json
            INSTALLATION.txt
          compression-level: 0
          retention-days: 7
      - name: Publish installable test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" ustavy-offline.apk ustavy-offline.zip ustavy-books.rar SHA256SUMS.txt ASSET_REPORT.json TRANSLATION_TESTS.json NMT_ASSET_REPORT.json INSTALLATION.txt --title "Уставы и книги 0.7 — переводчик — сборка ${{ github.run_number }}" --notes "Офлайн специализированный OPUS-MT переводчик: русский ↔ английский и русский ↔ украинский. Текст, импорт TXT/PDF/EPUB/FB2, перевод из читалки, остановка, сохранение черновика и экспорт редактируемого результата в TXT UTF-8. До 100 000 символов за задачу; вёрстка и картинки не переносятся. Проверены четыре направления на встроенной модели. Сохранение иллюстраций EPUB/FB2, встроенных картинок PDF и страницы PDF целиком в PNG через системный выбор папки. EPUB, FB2 и FB2.ZIP с иллюстрациями; PDF и TXT. Выделение текста в читалке и статьях, цитаты с комментариями, подсветка и переход к источнику, изменение и удаление заметок. Тема и фон: тёмная, светлая, тёплая, чёрная, свой цвет и своя картинка с телефона; общее оформление приложения и читалки. PDF с иллюстрациями, TXT, JPG/PNG/WebP. Масштаб страниц, закладки и сохранение места. Офлайн OCR русского и английского печатного текста из PDF и фотографий. Кнопка Распознать текст на текущей странице; проверка и исправление результата, сохранение для поиска и ИИ. Проверены реальное распознавание русского текста, скан PDF и пустая страница. Тип установки указан в INSTALLATION.txt; если подпись предыдущего тестового APK не совпадает, сборка Уставы • переводчик устанавливается отдельно, старая версия и её данные сохраняются. Проверены чтение PDF, иллюстрации и восстановление страницы в Android-эмуляторе. Без INTERNET. Проверка на Samsung S25 Ultra требуется." --prerelease --target "${{ github.sha }}"

